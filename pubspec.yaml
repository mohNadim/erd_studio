name: dbml_erd_studio
description: Open-source desktop ERD designer built with Flutter. Write DBML, get a high-quality diagram.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  dbml_parser: ^0.2.0
  pdf: ^3.13.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
